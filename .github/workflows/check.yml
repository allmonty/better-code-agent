# Quality gate for better-code-agent itself, plus a scheduled/manual link check.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Quality gate
        run: scripts/check.sh

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check reference links
        run: scripts/check-links.sh
